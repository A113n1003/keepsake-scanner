name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow or user need is not handled today?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Privacy and compatibility impact
      description: Note any new data, permissions, scanner behavior, or migration concerns.
    validations:
      required: true
